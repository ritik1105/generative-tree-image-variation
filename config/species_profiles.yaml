Neem:

  common_name: Neem
  scientific_name: Azadirachta indica

  taxonomy:
    family: Meliaceae
    type: Broadleaf
    origin: Indian Subcontinent

  appearance:

    canopy:
      - broad umbrella-shaped canopy
      - moderately dense crown
      - irregular branching pattern

    trunk:
      - thick rough brown trunk
      - deeply fissured bark
      - sturdy mature appearance

    leaves:
      - pinnate compound leaves
      - vibrant green foliage
      - medium-sized leaflets
      - dense leaf clusters

    branches:
      - spreading branches
      - slightly drooping secondary branches

    roots:
      - not visible

  size:

    height:
      mature: "15-20 meters"

    canopy_width:
      mature: "10-15 meters"

  environment:

    climate:
      - tropical
      - subtropical

    terrain:
      - farmland
      - roadside
      - village landscape
      - open fields
      - parks

    soil:
      - dry soil
      - well-drained soil

  seasonal_characteristics:

    spring:
      - fresh green leaves
      - small white flowers

    summer:
      - lush dense canopy
      - healthy green foliage

    monsoon:
      - wet bark
      - glossy leaves
      - rain droplets

    autumn:
      - minor leaf shedding

    winter:
      - slightly lighter foliage
      - sparse flowering

  health:

    healthy:
      - dense canopy
      - vibrant leaves
      - no visible disease

    mildly_stressed:
      - slight yellowing leaves
      - mildly reduced foliage

    moderately_stressed:
      - noticeable leaf loss
      - dry branches

    severely_stressed:
      - sparse canopy
      - dead branches
      - dry bark

  photography:

    ideal_views:
      - front
      - side
      - low angle

    composition:
      - full tree visible
      - centered composition

